name: build

on:
  # No build on pushes to main: PRs are built, and a v* tag builds the release.
  push:
    tags: ['v*']
  pull_request:
  # Actions tab > build > Run workflow. Fill "release" (e.g. v0.0.1) to build
  # and publish that release from the chosen branch without pushing a tag.
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to create, e.g. v0.0.1 (leave empty to only build)"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            artifact: target/release/bundle/nsis/*.exe
          - os: macos-latest
            args: "--target universal-apple-darwin"
            artifact: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      # Node is only used to run the Tauri CLI via npx below; the app ships no Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: unit tests
        run: cargo test -p paneful --lib
      # No paid signing for now: macOS bundle is ad-hoc signed
      # (signingIdentity "-"), Windows installer is unsigned.
      - name: bundle
        run: npx --yes @tauri-apps/cli@2.12.5 build ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: paneful-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      # Windows portable: the bare exe (UI is embedded, WebView2 loader is
      # linked statically) zipped up. Needs the WebView2 runtime on the PC.
      - name: portable zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item target/release/paneful.exe portable/Paneful.exe
          Copy-Item LICENSE portable/LICENSE.txt
          Compress-Archive -Path portable/* -DestinationPath "Paneful_${ver}_x64-portable.zip"
      - if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: paneful-windows-portable
          path: Paneful_*_x64-portable.zip
          if-no-files-found: error

  # Tag push (v*): attach the installers to a public GitHub Release so people
  # can download them without a GitHub login or an expiry date.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          ls -l dist
          case "$TAG" in v[0-9]*) ;; *) echo "tag must look like v0.0.1: $TAG"; exit 1;; esac
          # File names carry tauri.conf.json's version; refuse a mismatched tag.
          if ! ls dist | grep -qF "_${TAG#v}_"; then
            echo "no installer named for ${TAG#v}; bump src-tauri/tauri.conf.json version first"; exit 1
          fi
          # On a tag push the tag exists already; on a manual run this creates
          # it at the built commit.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Paneful $TAG" \
            --generate-notes
