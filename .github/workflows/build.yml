name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            artifact: target/release/bundle/nsis/*.exe
          - os: macos-latest
            args: "--target universal-apple-darwin"
            artifact: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: unit tests
        run: cargo test -p paneful --lib
      # No paid signing for now: macOS bundle is ad-hoc signed
      # (signingIdentity "-"), Windows installer is unsigned.
      - name: bundle
        run: npx --yes @tauri-apps/cli@2.12.5 build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: paneful-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
