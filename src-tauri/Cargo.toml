[package]
name = "paneful"
version = "0.0.8"
edition = "2021"
description = "Lightweight split-pane desktop client for x.com with isolated accounts"
license = "MIT"
publish = false

[lib]
name = "paneful_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
# Multi-webview in one window (WindowBuilder / WebviewBuilder / add_child)
# needs `unstable`. Pinned exactly: unstable APIs may break on minor bumps.
# `tray-icon`: hide the window to the tray / menu bar.
tauri = { version = "=2.12.7", features = ["unstable", "tray-icon"] }
# Must match the vendored crate in crates/tauri-runtime-wry.
tauri-runtime-wry = "=2.12.5"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
log = "0.4"
tauri-plugin-log = "2"
# "원본 저장": cookie-less download of one twimg file. OS TLS (SChannel /
# Security.framework), no extra crypto crates.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2"] }
# Post capture: copy the PNG to the clipboard (Rust side only, no JS API).
tauri-plugin-clipboard-manager = "2"
# Post capture: decode screenshots, crop, stack and encode. Already in the
# tree through tauri.
png = "0.18"
# Show/hide toggle that works while another app has focus.
tauri-plugin-global-shortcut = "2"
# Folder picker for the save folder in settings (used from Rust only).
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
# Same versions tauri-runtime-wry 2.12.5 uses: the M0 profile check and the
# post capture screenshot (CapturePreview into a memory stream, snap.rs).
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Post capture screenshot (WKWebView takeSnapshot, snap.rs). Same versions
# wry uses.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep", "NSResponder", "NSView"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
# Panel memory (memory.rs): proc_pid_rusage. Already in the tree.
libc = "0.2"
